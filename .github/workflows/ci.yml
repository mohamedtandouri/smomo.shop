name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Build & Verify
    runs-on: ubuntu-latest

    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./dev.db"
      NEXTAUTH_SECRET: "ci-secret-for-testing-purposes-only-32chars"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_URL: "http://localhost:3000/api"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          npx prisma generate
          if [ -f "admin-backend/prisma/schema.prisma" ]; then
            npx prisma generate --schema=admin-backend/prisma/schema.prisma
          fi

      - name: Run Linter
        run: npm run lint --if-present
        continue-on-error: true

      - name: Build Admin Backend
        run: npm run build:admin

      - name: Build Storefront
        run: npm run build:storefront

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Root Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: smomo-platform:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
